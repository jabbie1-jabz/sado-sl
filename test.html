<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SADO-SL Agricultural Marketplace</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 40px 0;
      color: #2c3e50;
    }

    .filter-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      border: 2px solid #3498db;
      background: white;
      color: #3498db;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #3498db;
      color: white;
    }

    .goods-grid,
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .good-card,
    .video-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .good-card:hover,
    .video-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .good-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .good-body {
      padding: 20px;
    }

    .good-tag {
      display: inline-block;
      background: #27ae60;
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .good-card h4,
    .video-card h4 {
      margin: 10px 0;
      color: #2c3e50;
    }

    .good-qty {
      font-size: 12px;
      color: #7f8c8d;
      margin: 10px 0;
    }

    .good-card p,
    .video-card p {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }

    .btn-inquire {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .btn-inquire:hover {
      background: #c0392b;
    }

    .video-card iframe,
    .video-card video {
      width: 100%;
      height: 200px;
    }

    .video-info {
      padding: 15px;
    }

    .form-section {
      background: white;
      padding: 30px;
      border-radius: 8px;
      margin: 30px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .form-section h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #2c3e50;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #bdc3c7;
      border-radius: 5px;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: background 0.3s;
    }

    .btn-submit:hover {
      background: #2980b9;
    }

    /* Modal Styles */
    .inquiry-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fefefe;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .close-modal {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-modal:hover {
      color: #000;
    }

    #modal-product-name {
      color: #e74c3c;
      font-weight: 600;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌾 SADO-SL Agricultural Marketplace</h1>

    <!-- Products Section -->
    <section id="products">
      <h2 style="text-align: center; margin: 30px 0; color: #2c3e50;">Agricultural Products & Services</h2>
      
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All Products</button>
        <button class="filter-btn" data-filter="Fruits">Fruits</button>
        <button class="filter-btn" data-filter="Pest Control">Pest Control</button>
      </div>

      <div id="goods-grid" class="goods-grid"></div>
    </section>

    <!-- Add New Product Form -->
    <section id="add-product">
      <div class="form-section">
        <h2>📦 Publish New Agricultural Good</h2>
        <form id="good-form">
          <div class="form-group">
            <label for="good-title">Product Title</label>
            <input type="text" id="good-title" required>
          </div>
          <div class="form-group">
            <label for="good-category">Category</label>
            <select id="good-category" required>
              <option>Fruits</option>
              <option>Vegetables</option>
              <option>Pest Control</option>
              <option>Fertilizer</option>
            </select>
          </div>
          <div class="form-group">
            <label for="good-qty">Quantity Available</label>
            <input type="text" id="good-qty" required>
          </div>
          <div class="form-group">
            <label for="good-desc">Description</label>
            <textarea id="good-desc" required></textarea>
          </div>
          <div class="form-group">
            <label for="good-image">Product Image</label>
            <input type="file" id="good-image" accept="image/*" required>
          </div>
          <button type="submit" class="btn-submit">Publish Product</button>
        </form>
      </div>
    </section>

    <!-- Videos Section -->
    <section id="videos">
      <h2 style="text-align: center; margin: 30px 0; color: #2c3e50;">🎬 Farm & Field Videos</h2>
      <div id="videos-grid" class="videos-grid"></div>
    </section>

    <!-- Add New Video Form -->
    <section id="add-video">
      <div class="form-section">
        <h2>🎥 Publish New Farm Video</h2>
        <form id="video-form">
          <div class="form-group">
            <label for="video-title">Video Title</label>
            <input type="text" id="video-title" required>
          </div>
          <div class="form-group">
            <label for="video-desc">Video Description</label>
            <textarea id="video-desc" required></textarea>
          </div>
          <div class="form-group">
            <label for="video-file">Video File (Local Upload)</label>
            <input type="file" id="video-file" accept="video/*">
          </div>
          <div style="text-align: center; margin: 15px 0; color: #7f8c8d;">OR</div>
          <div class="form-group">
            <label for="video-url">YouTube Video URL</label>
            <input type="text" id="video-url" placeholder="https://www.youtube.com/watch?v=...">
          </div>
          <button type="submit" class="btn-submit">Publish Video</button>
        </form>
      </div>
    </section>
  </div>

  <!-- Inquiry Modal -->
  <div id="inquiry-modal" class="inquiry-modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>Product Inquiry Form</h2>
      <div id="modal-product-name"></div>
      <form id="inquiry-form">
        <div class="form-group">
          <label for="inquirer-name">Your Name</label>
          <input type="text" id="inquirer-name" required>
        </div>
        <div class="form-group">
          <label for="inquirer-email">Your Email</label>
          <input type="email" id="inquirer-email" required>
        </div>
        <div class="form-group">
          <label for="inquirer-phone">Your Phone</label>
          <input type="text" id="inquirer-phone" required>
        </div>
        <div class="form-group">
          <label for="inquirer-message">Your Message</label>
          <textarea id="inquirer-message" required></textarea>
        </div>
        <button type="submit" class="btn-submit">Submit Inquiry</button>
      </form>
    </div>
  </div>

  <script>
    // Initial Agricultural Goods based on SADO-SL's Falaba District Farm & Services
    const defaultGoods = [
      {
        id: 1,
        title: "Sweet Falaba Pineapples",
        category: "Fruits",
        qty: "Bulk & Wholesale Supply Available",
        desc: "Freshly harvested pineapples cultivated on our 50+ acre agricultural estate in Falaba District, Sierra Leone.",
        image: "https://images.unsplash.com/photo-1550258987-190a2d41a8ba?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: 2,
        title: "Farm-Fresh Mangoes",
        category: "Fruits",
        qty: "Seasonal Crates & Export Ready",
        desc: "Naturally ripened, pest-free mangoes grown using sustainable integrated pest management techniques.",
        image: "https://images.unsplash.com/photo-1553279768-865429fa0078?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: 3,
        title: "Organic Highland Bananas",
        category: "Fruits",
        qty: "Weekly Harvest Bunches",
        desc: "Nutrient-rich bananas cultivated by local youths and farmers empowering national food security.",
        image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: 4,
        title: "Integrated Pest Control & Agro-Advisory",
        category: "Pest Control",
        qty: "Nationwide Farm Consultation",
        desc: "Safe, reliable, and cost-effective pest control management systems and farmer capacity training.",
        image: "https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=800&q=80"
      }
    ];

    // Initial Field Videos
    const defaultVideos = [
      {
        id: 101,
        title: "SADO-SL Falaba Agricultural Plantation Overview",
        desc: "Touring our 50+ acres of pineapple, mango, and banana cultivation driving food sufficiency in Sierra Leone.",
        type: "youtube",
        src: "https://www.youtube.com/embed/ScMzIvxBSi4"
      }
    ];

    let goodsList = JSON.parse(localStorage.getItem("sadoGoods")) || defaultGoods;
    let videosList = JSON.parse(localStorage.getItem("sadoVideos")) || defaultVideos;

    const goodsGrid = document.getElementById("goods-grid");
    const videosGrid = document.getElementById("videos-grid");

    // Render Agricultural Goods
    function renderGoods(filter = "all") {
      goodsGrid.innerHTML = "";
      const filtered = filter === "all" ? goodsList : goodsList.filter(item => item.category === filter);

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "good-card";
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}" />
          <div class="good-body">
            <span class="good-tag">${item.category}</span>
            <h4>${item.title}</h4>
            <div class="good-qty">${item.qty}</div>
            <p>${item.desc}</p>
            <button class="btn-inquire" onclick="openInquiry('${item.title.replace(/'/g, "\\'")}')">Inquire / Request Supply</button>
          </div>
        `;
        goodsGrid.appendChild(card);
      });
    }

    // Render Videos
    function renderVideos() {
      videosGrid.innerHTML = "";
      videosList.forEach(vid => {
        const card = document.createElement("div");
        card.className = "video-card";

        let mediaHTML = "";
        if (vid.type === "youtube") {
          mediaHTML = `<iframe src="${vid.src}" allowfullscreen></iframe>`;
        } else {
          mediaHTML = `<video controls src="${vid.src}"></video>`;
        }

        card.innerHTML = `
          ${mediaHTML}
          <div class="video-info">
            <h4>${vid.title}</h4>
            <p>${vid.desc}</p>
          </div>
        `;
        videosGrid.appendChild(card);
      });
    }

    // Filter Buttons
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderGoods(btn.dataset.filter);
      });
    });

    // Handle New Good Upload
    document.getElementById("good-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const title = document.getElementById("good-title").value;
      const category = document.getElementById("good-category").value;
      const qty = document.getElementById("good-qty").value;
      const desc = document.getElementById("good-desc").value;
      const fileInput = document.getElementById("good-image");

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function (event) {
          const newGood = {
            id: Date.now(),
            title,
            category,
            qty,
            desc,
            image: event.target.result
          };
          goodsList.unshift(newGood);
          localStorage.setItem("sadoGoods", JSON.stringify(goodsList));
          renderGoods();
          document.getElementById("good-form").reset();
          alert("New agricultural good published successfully!");
          document.getElementById("products").scrollIntoView({ behavior: "smooth" });
        };
        reader.readAsDataURL(fileInput.files[0]);
      }
    });

    // Handle New Video Upload (Local File or YouTube URL)
    document.getElementById("video-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const title = document.getElementById("video-title").value;
      const desc = document.getElementById("video-desc").value;
      const fileInput = document.getElementById("video-file");
      const youtubeUrl = document.getElementById("video-url").value.trim();

      if (fileInput.files && fileInput.files[0]) {
        const videoBlobUrl = URL.createObjectURL(fileInput.files[0]);
        videosList.unshift({
          id: Date.now(),
          title,
          desc,
          type: "local",
          src: videoBlobUrl
        });
        renderVideos();
        this.reset();
        alert("Video uploaded to the showcase!");
        document.getElementById("videos").scrollIntoView({ behavior: "smooth" });
      } else if (youtubeUrl) {
        let embedUrl = youtubeUrl;
        if (youtubeUrl.includes("watch?v=")) {
          const videoId = youtubeUrl.split("watch?v=")[1].split("&")[0];
          embedUrl = `https://www.youtube.com/embed/${videoId}`;
        } else if (youtubeUrl.includes("youtu.be/")) {
          const videoId = youtubeUrl.split("youtu.be/")[1].split("?")[0];
          embedUrl = `https://www.youtube.com/embed/${videoId}`;
        }

        videosList.unshift({
          id: Date.now(),
          title,
          desc,
          type: "youtube",
          src: embedUrl
        });
        localStorage.setItem("sadoVideos", JSON.stringify(videosList));
        renderVideos();
        this.reset();
        alert("YouTube video published to the showcase!");
        document.getElementById("videos").scrollIntoView({ behavior: "smooth" });
      } else {
        alert("Please select a video file from your device or paste a YouTube link.");
      }
    });

    // Modal Logic for Product Inquiries
    const modal = document.getElementById("inquiry-modal");
    const closeModal = document.querySelector(".close-modal");

    function openInquiry(productName) {
      document.getElementById("modal-product-name").textContent = "Product: " + productName;
      modal.style.display = "flex";
    }

    closeModal.onclick = () => (modal.style.display = "none");
    window.onclick = (e) => {
      if (e.target === modal) modal.style.display = "none";
    };

    document.getElementById("inquiry-form").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Thank you! Your supply inquiry has been recorded for SADO-SL (sierra-integrated@yahoo.com).");
      this.reset();
      modal.style.display = "none";
    });

    // Initial Render
    renderGoods();
    renderVideos();
  </script>
</body>
</html>
